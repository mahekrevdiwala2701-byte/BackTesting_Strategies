[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F3F5FA"
secondaryBackgroundColor = "#EEF1F7"
textColor = "#0F1B3D"
borderColor = "#E2E7F0"
baseRadius = "0.75rem"
font = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFont = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5FA"
borderColor = "#E2E7F0"

[client]
toolbarMode = "minimal"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
port = 8501

[browser]
gatherUsageStats = false