[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#0A0F1E"
secondaryBackgroundColor = "#141B2F"
textColor = "#E6EAF5"
borderColor = "#232D4A"
baseRadius = "0.75rem"
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFont = "'Bricolage Grotesque':https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0D1426"
secondaryBackgroundColor = "#17203A"
borderColor = "#1F2944"

[client]
toolbarMode = "minimal"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
port = 8501

[browser]
gatherUsageStats = false